// 計算行動預計數值預覽（含天賦、NPC羈絆與深夜時段加成）
function getActionPreview(k){
  if(!G) return { tags: [], note: '' };
  const isNight = getTimePeriod() === 'night';
  const stressMul = G.talentEffects.stressMul || 1;
  const calcSt = raw => raw > 0 ? Math.round(raw * stressMul * (G.pers==='chill'?0.8:1)) : raw + ((G.major==='arts'||G.major==='soc')&&raw<0?-1:0);
  const tags = [];
  let note = '';

  if(k === 'study'){
    const studyMul = G.talentEffects.studyMul || 1.0;
    const yuBonus = (G.aff && G.aff.yu >= 60) ? 2 : 0;
    const gainK = Math.round(6 * studyMul) + yuBonus;
    const stOk = calcSt(4 + (isNight ? 2 : 0));
    tags.push({ txt: `答對 學識+${gainK}`, cls: 'pos' });
    tags.push({ txt: `壓力+${stOk}`, cls: 'neg' });
    if(isNight) note = '🌙 深夜熬夜：壓力額外 +2';
  } else if(k === 'work'){
    const stOk = calcSt(2 + (isNight ? 2 : 0));
    tags.push({ txt: '薪資 $420~$1500+', cls: 'pos' });
    tags.push({ txt: '技能+1~2', cls: 'pos' });
    tags.push({ txt: `壓力+${stOk}~${calcSt(5 + (isNight ? 2 : 0))}`, cls: 'neg' });
    if(isNight) note = '🌙 深夜班表：壓力額外 +2';
  } else if(k === 'hobby'){
    const stOk = calcSt(-4);
    tags.push({ txt: '成功 技能+4', cls: 'pos' });
    tags.push({ txt: `壓力${stOk}`, cls: 'pos' });
    tags.push({ txt: '失手 技能+1 壓力-1', cls: '' });
  } else if(k === 'play'){
    let cost = G.r === 0 ? 250 : 200;
    if(G.talentEffects.costMul) cost = Math.round(cost * G.talentEffects.costMul);
    let relief = -12;
    if(G.aff && G.aff.kai >= 60) relief -= 4;
    if(isNight) relief -= 2;
    tags.push({ txt: `花費 -$${cost}`, cls: 'neg' });
    tags.push({ txt: `壓力${relief}`, cls: 'pos' });
    if(isNight) note = '🌙 深夜夜市加成：額外減壓 -2';
  } else if(k === 'sport'){
    const gainH = 5 + (G.talentEffects.sportHealth || 0);
    const stOk = isNight ? calcSt(2) - 5 : -5;
    tags.push({ txt: `成功 健康+${gainH}`, cls: 'pos' });
    tags.push({ txt: `壓力${stOk > 0 ? '+' + stOk : stOk}`, cls: stOk <= 0 ? 'pos' : 'neg' });
    if(isNight) note = '🌙 深夜夜跑：疲勞感增加 (+2 壓力)';
  } else if(k === 'social'){
    const socialBonus = G.talentEffects.socialMul ? 2 : 0;
    const gainSk = 2 + socialBonus;
    const relief = -3 - socialBonus - (isNight ? 2 : 0);
    const affGain = Math.round(10 * (G.talentEffects.socialMul || 1));
    tags.push({ txt: `成功 技能+${gainSk}`, cls: 'pos' });
    tags.push({ txt: `好感+${affGain}`, cls: 'pos' });
    tags.push({ txt: `壓力${relief}`, cls: 'pos' });
    if(isNight) note = '🌙 深夜夜聊加成：額外減壓 -2';
  } else if(k === 'shop'){
    tags.push({ txt: '免消耗體力', cls: 'pos' });
    tags.push({ txt: '購買補給與御守', cls: '' });
  } else if(k === 'end'){
    tags.push({ txt: `進入${periodEndUnit()}事件`, cls: 'warn' });
    tags.push({ txt: '發票開獎與結算', cls: '' });
  }
  return { tags, note };
}

  const desc = k === 'end' ? `結束${periodUnit()}行動，進入${periodEndUnit()}事件與結算。` : l[3];

    ? `<div class="tip-fx">${prev.tags.map(tg => `<span class="tip-tag ${tg.cls}">${tg.txt}</span>`).join('')}</div>`
    : '';
  const rateHtml = (cost > 0 && k !== 'work' && k !== 'study' && k !== 'play')
    ? `<div style="margin-top:4px;font-size:12px;color:var(--gold-t);font-weight:bold;">預估大成功機率：${Math.round(prob(a)*100)}%</div>`
    : '';
  const noteHtml = prev.note ? `<div style="margin-top:4px;font-size:11px;color:var(--warn-t);">${prev.note}</div>` : '';
  const touchHtml = isTouchPreview ? `<div style="margin-top:5px;font-size:11px;color:var(--ac);font-weight:bold;">👆 再次點擊地標確認前往</div>` : '';

  t.innerHTML = `<b>${l[2]} ✦ 行動預覽</b><div style="margin-top:2px;">${desc}</div>${rateHtml}${tagsHtml}${noteHtml}${touchHtml}`;
  const tipX = Math.min(Math.max(l[0] * 12.8, 142), 1280 - 142);
  t.style.left = tipX + 'px';

// 事件代理綁定 Pin 按鈕點擊（支援桌面滑鼠懸停預覽 + 觸控兩段式預覽確認）
let lastPointerType = 'mouse';
$('pins').onpointerdown = e => { lastPointerType = e.pointerType || 'mouse'; };
$('pins').onpointerover = e => {
  if(e.pointerType === 'touch') return;
  const b = e.target.closest('.pin');
  if(b) tip(b.dataset.k, false);
};
$('pins').onpointerout = e => {
  const from = e.target.closest && e.target.closest('.pin');
  const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('.pin') : null;
  if(from && from === to) return;
  if(lastPointerType !== 'touch') $('tip').classList.add('hid');
};
$('pins').onclick = e => {
  const b = e.target.closest('.pin');
  if(!b || b.disabled || (G && G.talentPending)) return;
  const k = b.dataset.k;
  if(lastPointerType === 'touch' && lastTouchPreviewPin !== k && k !== 'shop' && k !== 'end'){
    lastTouchPreviewPin = k;
    SFX.play('click');
    tip(k, true);
    return;
  }
  lastTouchPreviewPin = null;
  $('tip').classList.add('hid');
  SFX.play('click');
  burstPin(k);
  if(k === 'end') endMonth();
  else if(k === 'shop') openShopModal();
  else if(k === 'play') openPlayChoices();
  else if(k === 'hobby') openClubChoices();
  else act(k);
};

// 數值變動浮動文字動畫
function showFloat(k, before){
  const changes = [];
  let isCrit = false;

  ['k','m','sk','h'].forEach(key => {
    if(G.s[key] !== before[key]){
      const diff = G.s[key] - before[key];
      const critHit = diff >= 10 || (key === 'm' && diff >= 500) || (key === 'sk' && diff >= 6);
      if(critHit) isCrit = true;
      changes.push({
        txt: `${diff>0?'+':''}${diff} ${NAMES[key][0]}`,
        neg: diff < 0,
        key: key,
        crit: critHit
      });
    }
  });

  const stDiff = G.s.st - before.st;
  if(stDiff !== 0){
    const critStress = Math.abs(stDiff) >= 12;
    if(critStress) isCrit = true;
    changes.push({
      txt: `${stDiff>0?'+':''}${stDiff} 壓力`,
      neg: stDiff > 0,
      key: 'st',
      crit: critStress
    });
  }

  const container = $('s-turn');
  if(!container) return;
  const loc = LOC[k] || [50, 50];

  if(isCrit){
    SFX.play('crit');
  }

  changes.forEach((c, idx) => {
    const el = document.createElement('div');
    el.className = c.crit ? 'crit-text' : 'float';
    
    let color = '#38bdf8';
    if(c.key === 'm') color = '#fbbf24';
    else if(c.key === 'sk') color = '#c084fc';
    else if(c.key === 'h') color = '#4ade80';
    else if(c.key === 'st') color = c.neg ? '#f87171' : '#2dd4bf';

    if(c.crit){
      el.innerHTML = `<span class="crit-badge">CRIT!</span> <span style="color:${color};">${c.txt}</span>`;
    } else {
      el.textContent = c.txt;
      if(c.neg) el.classList.add('neg');
      el.style.color = color;
    }

    el.style.left = `calc(${loc[0]}% + ${(idx - changes.length/2) * 35}px)`;
    el.style.top = `calc(${loc[1]}% - ${32 + idx * 18}px)`;
    container.appendChild(el);
    setTimeout(() => el.remove(), c.crit ? 1250 : 950);
  });
}

// ─── 全螢幕星輝祈願 Canvas 流星動畫 ──────────────────
function playWarpAnimation(onComplete){
  const canvas = $('warp-canvas');
  if(!canvas){ if(onComplete) onComplete(); return; }
  canvas.classList.remove('hid');
  canvas.width = 1280;
  canvas.height = 714;
  const ctx = canvas.getContext('2d');
  
  SFX.play('warp_start');
  const startTime = (window.performance ? performance.now() : Date.now());
  const duration = 1200;
  
  const stars = Array.from({length: 70}, () => ({
    x: Math.random() * 1280,
    y: Math.random() * 714,
    speed: 6 + Math.random() * 14,
    size: 1 + Math.random() * 2.5,
    gold: Math.random() > 0.45
  }));

  const meteor = { x: -120, y: 120, targetX: 1400, targetY: 520 };
  let goldChimePlayed = false;

  function render(now){ now = now || (window.performance ? performance.now() : Date.now());
    const elapsed = now - startTime;
    const progress = Math.min(1, elapsed / duration);

    ctx.fillStyle = 'rgba(7, 10, 19, 0.42)';
    ctx.fillRect(0, 0, 1280, 714);

    stars.forEach(s => {
      s.x += s.speed * (1 + progress * 2.2);
      if(s.x > 1280) s.x = 0;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = s.gold ? '#fbbf24' : '#e0e7ff';
      ctx.shadowBlur = 8;
      ctx.shadowColor = s.gold ? '#f59e0b' : '#818cf8';
      ctx.fill();
    });

    if(progress > 0.12 && progress < 0.88){
      if(!goldChimePlayed && progress > 0.28){
        SFX.play('warp_gold');
        goldChimePlayed = true;
      }
      const mProg = (progress - 0.12) / 0.76;
      const curX = meteor.x + (meteor.targetX - meteor.x) * mProg;
      const curY = meteor.y + (meteor.targetY - meteor.y) * mProg;
      
      const grad = ctx.createLinearGradient(curX - 220, curY - 70, curX, curY);
      grad.addColorStop(0, 'rgba(245, 158, 11, 0)');
      grad.addColorStop(0.65, 'rgba(251, 191, 36, 0.65)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 1)');

      ctx.beginPath();
      ctx.moveTo(curX - 260, curY - 80);
      ctx.lineTo(curX, curY);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 28;
      ctx.shadowColor = '#fbbf24';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(curX, curY, 14, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 35;
      ctx.shadowColor = '#fef08a';
      ctx.fill();
    }

    if(progress < 1){
      requestAnimationFrame(render);
    } else {
      ctx.clearRect(0, 0, 1280, 714);
      canvas.classList.add('hid');
      if(onComplete) onComplete();
    }
  }
  requestAnimationFrame(render);
}

// ─── IAA 激勵型廣告統一適配層 (AdManager SDK Adapter) ──────────
// 接入真實廣告：AdManager.registerProvider(({ placement, title, rewardDesc, onComplete, onError }) => { /* 呼叫廣告 SDK，播完後 onComplete() */ });
// 目前使用內建「模擬贊助短片」，不會產生任何實際收益。
const AdManager = {
  provider: null,
  stats: { impressions: 0, completions: 0 },
  lastShown: 0,
  hourLog: [],
  // 冷卻剩餘毫秒：兩次廣告間隔 + 每小時上限，避免廣告疲勞（可在 CONFIG.ad 調整）
  cooldownLeft(){
    const now = Date.now();
    this.hourLog = this.hourLog.filter(t => now - t < 3600000);
    if(this.hourLog.length >= CONFIG.ad.hourlyCap) return this.hourLog[0] + 3600000 - now;
    return Math.max(0, this.lastShown + CONFIG.ad.minGapMs - now);
  },
  _done(placement){
    this.stats.completions++;
    Track.event('ad_complete', { placement });
    Ach.bump('ads');
  },
  registerProvider(fn) {
    if (typeof fn === 'function') this.provider = fn;
  },
  showRewarded({ placement, title, rewardDesc, onReward, onFail }) {
    // 無廣告模式（預設）：改用學分幣兌換，不播放任何廣告
    if(!CONFIG.monetization.adsEnabled) return Monetize.exchange({ placement, title, rewardDesc, onReward, onFail });
    // 混合模式下，贊助者／通行證免看短片直接領取
    if(Entitlements.adFree()){
      Track.event('ad_skipped_vip', { placement });
      showGlobalNotice('✦ 贊助者特權：免看短片，獎勵直接入帳');
      if(typeof onReward === 'function') onReward();
      return;
    }
    const wait = this.cooldownLeft();
    if(wait > 0){
      showGlobalNotice(`贊助短片冷卻中，請 ${Math.ceil(wait / 1000)} 秒後再試`, true);
      if(typeof onFail === 'function') onFail('cooldown');
      return;
    }
    this.lastShown = Date.now();
    this.hourLog.push(this.lastShown);
    Track.event('ad_offer', { placement });
    this.stats.impressions++;
    if (this.provider) {
      this.provider({
        placement,
        title,
        rewardDesc,
        onComplete: () => {
          this._done(placement);
          if (typeof onReward === 'function') onReward();
        },
        onError: err => {

function addNpcAffection(npcId, baseDelta){
  if(!G || !G.aff || G.aff[npcId] === undefined) return 0;
  const mul = G.talentEffects.socialMul || 1.0;
  let gain = Math.round(baseDelta * mul) + (G.major==='soc'&&baseDelta>0?2:0);
  const oldVal = G.aff[npcId];
  if(oldVal >= 60 && gain > 0) gain = Math.max(1, Math.round(gain * 0.5));
  G.aff[npcId] = cl(oldVal + gain, 0, 100);
  const crossed=[35,60,80].filter(level=>oldVal<level&&G.aff[npcId]>=level);
  if(crossed.length){
    G.bondStorySeen=G.bondStorySeen||{kai:{},yu:{},boss:{}};
    G.bondStoryQueue=G.bondStoryQueue||[];
    G.bondStorySeen[npcId]=G.bondStorySeen[npcId]||{};
    crossed.forEach(level=>{
      if(G.bondStorySeen[npcId][level])return;
      G.bondStorySeen[npcId][level]=true;
      G.bondStoryQueue.push({npcId,level});
      recordTimeline(`${NPC_META[npcId].name}羈絆突破 ${level}`);
    });
    saveRunState();
  }
  return gain;
}

function drainBondStoryQueue(onComplete=null){
  const done=onComplete||(()=>{if(G){show('s-map');renderTurn();}});
  if(!G){done();return;}
  if(bondStoryRunning)return;
  if(!G.bondStoryQueue?.length){done();return;}
  bondStoryRunning=true;
  const item=G.bondStoryQueue[0],story=BOND_STORIES[item.npcId]?.[item.level];
  if(!story){G.bondStoryQueue.shift();bondStoryRunning=false;saveRunState();drainBondStoryQueue(done);return;}
  G.npcOutfit=G.npcOutfit||{};G.npcOutfit[item.npcId]=item.level;saveRunState();
  const finish=choice=>{
    if(choice===0)apply({st:-2,sk:1});else apply({st:-4});
    G.bondStoryQueue.shift();
    recordTimeline(`完成${NPC_META[item.npcId].name}羈絆短篇（${item.level}）`);
    bondStoryRunning=false;saveRunState();
    if(G.bondStoryQueue.length)drainBondStoryQueue(done);else done();
  };
  card({t:story[0],x:story[1],npc:item.npcId,nm:'happy',c:[{t:'繼續聊聊',cb:()=>card({t:story[0],x:story[2],npc:item.npcId,nm:'normal',c:[{t:'約定下次一起行動（壓力-2、技能+1）',cb:()=>finish(0)},{t:'安靜陪伴這段回憶（壓力-4）',cb:()=>finish(1)}]})}]});
}

  if(G.s.m < cost){

    SFX.play('fail');

  }
  apply({ m: -cost, st: -2 });

// 通用 Modal 控制
let modalReturnFocus = null;
let modalCanClose = true;

function openModal(contentHtml, showClose=true, wide=false){
  const layer = $('modal-layer');
  if(layer && layer.classList.contains('hid')) modalReturnFocus = document.activeElement;
  $('modal-body').innerHTML = contentHtml;
  const mc = $('modal-card');
  if(mc){ mc.classList.toggle('wide', Boolean(wide)); mc.scrollTop = 0; }
  $('modal-close').classList.toggle('hid', !showClose);
  modalCanClose = true;
  layer.classList.remove('hid');
  requestAnimationFrame(() => {
    const firstControl = $('modal-body')?.querySelector('button:not(:disabled), input, select, textarea');
    (firstControl || $('modal-close') || mc)?.focus();
  });
}
function closeModal(){
  RUNTIME.clearTimers();
  $('modal-layer').classList.add('hid');
  const returnFocus = modalReturnFocus;
  modalReturnFocus = null;
  if(returnFocus && typeof returnFocus.focus === 'function' && document.contains(returnFocus)){
    returnFocus.focus();
  }
}
$('modal-close').onclick = closeModal;
document.addEventListener('keydown', e => {
  if((e.key==='Enter'||e.key===' ')&&e.target?.matches?.('[role="button"]')){e.preventDefault();e.target.click();}
  const layer=$('modal-layer');
  if(e.key==='Tab'&&layer&&!layer.classList.contains('hid')){
    const nodes=[...layer.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
    if(nodes.length){const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  }
  if(e.key === 'Escape' && !$('modal-layer').classList.contains('hid') && modalCanClose){
    e.preventDefault();
    closeModal();
  }
});

// ═══ 學業：隨堂測驗（每次 3 題，答對越多學識越高） ═══
function studyQuiz(){
  const all = (QUIZ[G.major] || QUIZ.cs).filter(item => (item[3] || 1) <= quizTier());
  G.quizSeen = G.quizSeen || [];
  let fresh = all.filter(item => !G.quizSeen.includes(item[0]));
  if(fresh.length < 3){ G.quizSeen = []; fresh = all; }
  const picked = [...fresh].sort(() => Math.random() - 0.5).slice(0, 3);
  picked.forEach(q => G.quizSeen.push(q[0]));
  // 選項隨機排列，避免正解位置固定可被背答案
  const qs = picked.map(base => {
    const opts = base[1].map((text, i) => ({ text, i })).sort(() => Math.random() - 0.5);
    return [base[0], opts.map(o => o.text), opts.findIndex(o => o.i === base[2]), base[4]];
  });
  const auto = Boolean(G.bagBuffs.autoStudySuccess);
  if(auto) G.bagBuffs.autoStudySuccess = false;
  askStudy({ qs, idx: 0, correct: 0, auto, b4: { ...G.s }, hinted: false });
}

function askStudy(s){
  if(s.idx >= s.qs.length) return finishStudy(s);
  const q = s.qs[s.idx];
  const choices = q[1].map((opt, i) => ({
    t: opt,
    cb: () => {
      const ok = i === q[2];
      Track.event('quiz', { ok });
      if(ok){
        s.correct++;
        Ach.bump('quiz_correct'); Quest.bump('quiz_ok');
        SFX.play('success'); flash('happy'); showGlobalNotice('✔ 答對了！');
      } else {
        s.mistakes=s.mistakes||[];s.mistakes.push({question:q[0],answer:q[1][q[2]],explanation:q[3]||`正解是「${q[1][q[2]]}」；回想這個題目的核心定義與用途。`});
        SFX.play('fail'); flash('anxious'); showGlobalNotice(`✘ 正解是：${q[1][q[2]]}`, true);
      }
      s.idx++; s.hinted = false;
      askStudy(s);
    }
  }));
  // 提示：刪去 2 個錯誤選項（每局限 2 次；無廣告模式以學分幣兌換）
  if(!s.hinted && (G.adHintUsed || 0) < CONFIG.quiz.hintAdMaxPerRun && q[1].length > 2 && Monetize.available('quiz_hint')){
    choices.push({
      t: Monetize.btnText('quiz_hint', `刪去 2 個錯誤選項（每局限 ${CONFIG.quiz.hintAdMaxPerRun} 次）`),
      cb: () => watchRewardedAd('隨堂測驗提示', '刪去 2 個錯誤選項', () => {
        G.adHintUsed = (G.adHintUsed || 0) + 1;
        const wrong = q[1].map((_, i) => i).filter(i => i !== q[2]).sort(() => Math.random() - 0.5);
        const keep = [q[2], wrong[0]].sort((a, b) => a - b);
        s.qs[s.idx] = [q[0], keep.map(i => q[1][i]), keep.indexOf(q[2]), q[3]];
        s.hinted = true;
        askStudy(s);
      }, 'quiz_hint')
    });
  }
  card({ t: `隨堂測驗 · 第 ${s.idx + 1} / ${s.qs.length} 題（目前答對 ${s.correct}）`, x: q[0], c: choices });
}

function finishStudy(s){
  const studyMul = G.talentEffects.studyMul || 1.0;
  const yuBonus = (G.aff && G.aff.yu >= 60) ? 2 : 0;
  const total = s.qs.length;
  const n = Math.min(total, s.correct + (s.auto ? 1 : 0));
  const wrong = total - n;
  const nightSt = (G.t === 'night') ? 2 : 0;
  const gainK = n * Math.round(3 * studyMul) + wrong + (n > 0 ? yuBonus : 0);
  const pre = { ...G.s };
  apply({ k: gainK, st: 3 + wrong * 2 + nightSt });
  const realK = G.s.k - pre.k, realSt = G.s.st - pre.st;
  Quest.bump('study');
  if(n === total) Ach.bump('quiz_perfect');
  SFX.play(n === total ? 'great' : n >= 2 ? 'success' : 'fail');
  flash(n >= 2 ? 'happy' : 'anxious');
  const verdict = n === total ? '全部答對！教授當場點頭稱讚。' : n === 2 ? '答對兩題，表現不錯！' : n === 1 ? '只答對一題，還要再加把勁。' : '全軍覆沒…回去好好複習吧。';
  const review=(s.mistakes||[]).map(item=>`\n・${item.question}\n　正解：${item.answer}。${item.explanation}`).join('');
  const back = () => { G.log = `隨堂測驗答對 ${n} / ${total} 題。`; renderTurn(); showFloat('study', s.b4); saveRunState(); };
  const choices = [{ t: '回到校園', cb: back }];
  if((G.adStudyBonus || 0) < 2 && Monetize.available('study_bonus')){
    choices.push({
      t: Monetize.btnText('study_bonus', '學識收穫再 +50%（每局限 2 次）'),
      cb: () => watchRewardedAd('筆記加成', '學識額外 +50%', () => {
        G.adStudyBonus = (G.adStudyBonus || 0) + 1;
        apply({ k: Math.max(1, Math.round(gainK * 0.5)) });
        back();
      }, 'study_bonus')
    });
  }
  card({
    t: `隨堂測驗結果 · ${n} / ${total}`,
    x: `${verdict}${review ? `\n錯題回顧：${review}` : ''}\n學識${fmtSigned(realK)}${yuBonus && n > 0 ? ' [含小雨筆記+2]' : ''}，壓力${fmtSigned(realSt)}${nightSt ? ' [含深夜熬夜+2]' : ''}。${s.auto ? '\n（考古題精華加持：視為多答對 1 題）' : ''}`,
    c: choices
  });
}

      <div id="qte-feedback" style="font-size:16px;font-weight:700;margin-top:12px;height:24px;"></div>
    </div>`, false);
  const btns = [...document.querySelectorAll('#mg-opts .mg-btn')], fb = $('qte-feedback');
  const t0 = performance.now();
  let settled = false;
  const settle = pickIdx => {
    if(settled) return;
    settled = true;
    const elapsed = performance.now() - t0;
    RUNTIME.clearTimers();
    const pts = pickIdx === correct ? (elapsed <= limit * 0.55 ? 2 : 1) : 0;
    btns.forEach((b, i) => { b.disabled = true; if(i === correct) b.classList.add('ok'); else if(i === pickIdx) b.classList.add('bad'); });
    fb.innerHTML = pts === 2 ? '<span style="color:#fbbf24;">✦✦ 又快又準！</span>'
                 : pts === 1 ? '<span style="color:#38bdf8;">✦ 答對了，再快一點更好！</span>'
                 : '<span style="color:#f87171;">✦ 答錯或超時了...</span>';
    SFX.play(pts === 2 ? 'great' : pts === 1 ? 'success' : 'fail');
    RUNTIME.later(() => cb(pts), 850);
  };
  btns.forEach((b, i) => { b.onclick = () => settle(i); });
  RUNTIME.listen(e => { if(/^[1-9]$/.test(e.key) && Number(e.key) <= btns.length) settle(Number(e.key) - 1); });
  RUNTIME.later(() => settle(-1), limit);
}

// 玩法 1：吧台拉花時機（原 QTE，游標以時間差計算，不受螢幕更新率影響）
function runTimingGame(done){
  const JOB = '校園咖啡館';
  const rounds = [
    { name: '第 1 階段：準備與客製點單', desc: '顧客湧入！掌握好調配時機，別手滑！' },
    { name: '第 2 階段：核心調理與火候掌控', desc: '高溫萃取中！在金黃完美光譜區間果斷停下！' },
    { name: '第 3 階段：最後出餐與親切微笑', desc: '壓軸大單！抓住最完美的微笑出餐瞬間！' }
  ];
  let total = 0;
  function startRound(idx){
    if(idx >= 3) return done(total, JOB);
    RUNTIME.clearTimers();
    const cur = rounds[idx], speed = 2.4 + idx * 0.9;
    let pos = 12 + Math.random() * 20, dir = 1, running = true, hitDone = false;
    const pLeft = 40 + Math.floor(Math.random() * 18), pWidth = 14, gLeft = pLeft - 10, gWidth = pWidth + 20;
    openModal(`
      <div class="qte-modal">
        <div class="qte-title">🍳 ${JOB} · 吧台拉花時機</div>
        <p class="qte-scene">${cur.name}<br><small style="color:var(--mu);">${cur.desc}</small></p>
        <div class="qte-track-wrap" id="qte-track">
          <div class="qte-zone-great" style="left:${gLeft}%;width:${gWidth}%;"></div>
          <div class="qte-zone-perfect" style="left:${pLeft}%;width:${pWidth}%;">✦ PERFECT</div>
          <div class="qte-cursor" id="qte-cursor" style="left:${pos}%;"></div>
        </div>
        <div style="margin-top:14px;"><button class="qte-hit-btn" id="qte-btn">🔥 停！完美出品！ (點擊或按空白鍵)</button></div>
        <div id="qte-feedback" style="font-size:16px;font-weight:700;margin-top:12px;height:24px;"></div>
      </div>`, false);
    const cursor = $('qte-cursor'), feedback = $('qte-feedback'), btn = $('qte-btn');
    let lastTs = null;
    function loop(ts){
      if(!running) return;
      const now = ts || performance.now();
      if(lastTs === null) lastTs = now;
      const dt = Math.min(50, now - lastTs);
      lastTs = now;
      pos += speed * dir * (dt / 16.667);
      if(pos >= 96){ pos = 96; dir = -1; } else if(pos <= 4){ pos = 4; dir = 1; }
      if(cursor) cursor.style.left = pos + '%';
      RUNTIME.qteAnimId = requestAnimationFrame(loop);
    }
    RUNTIME.qteAnimId = requestAnimationFrame(loop);
    function onHit(){
      if(!running || hitDone) return;
      hitDone = true; running = false;
      cancelAnimationFrame(RUNTIME.qteAnimId); RUNTIME.qteAnimId = null;
      if(pos >= pLeft && pos <= pLeft + pWidth){
        total += 2;
        feedback.innerHTML = '<span style="color:#fbbf24;text-shadow:0 0 10px #f59e0b;">✦✦ PERFECT! 完美出品！暴擊收益！✦✦</span>';
        SFX.play('qte_perfect'); SFX.play('crit');
      } else if(pos >= gLeft && pos <= gLeft + gWidth){
        total += 1;
        feedback.innerHTML = '<span style="color:#38bdf8;">✦ GREAT! 表現良好！順利完成！✦</span>';
        SFX.play('success');
      } else {
        feedback.innerHTML = '<span style="color:#f87171;">✦ 手忙腳亂！稍微有點瑕疵...✦</span>';
        SFX.play('fail');
      }
      btn.disabled = true;
      RUNTIME.later(() => startRound(idx + 1), 750);
    }
    btn.onclick = onHit;
    RUNTIME.listen(e => { if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat) onHit(); } });
  }
  startRound(0);
}

// 玩法 2：外場記憶點單（逐一顯示餐點，消失後依序點回）
function runMemoryGame(done){
  const MENU = ['☕ 拿鐵', '🍰 草莓蛋糕', '🥪 起司三明治', '🍜 豚骨拉麵', '🧋 珍珠奶茶', '🍙 鮭魚飯糰'], JOB = '校園咖啡館';
  let total = 0;
  const round = idx => {
    if(idx >= 3) return done(total, JOB);
    RUNTIME.clearTimers();
    const len = 3 + idx, seq = Array.from({ length: len }, () => pick(MENU)), got = [];
    let miss = 0, ready = false;
    openModal(`
      <div class="qte-modal">
        <div class="qte-title">🧠 ${JOB} · 外場記憶點單</div>
        <p class="qte-scene">第 ${idx + 1} / 3 輪：記住客人點的 ${len} 樣餐點<br><small style="color:var(--mu);">餐點消失後依序點選（也可按數字鍵 1–6）</small></p>
        <div class="mg-seq" id="mg-seq"></div>
        <div class="mg-grid" id="mg-grid">${MENU.map((e, i) => `<button class="mg-btn" data-i="${i}" disabled aria-label="${e}">${e}</button>`).join('')}</div>
        <div id="qte-feedback" style="font-size:16px;font-weight:700;margin-top:12px;height:24px;"></div>
      </div>`, false);
    const seqEl = $('mg-seq'), fb = $('qte-feedback'), btns = [...document.querySelectorAll('#mg-grid .mg-btn')];
    seq.forEach((e, i) => RUNTIME.later(() => { seqEl.insertAdjacentHTML('beforeend', `<span>${e}</span>`); SFX.play('click'); }, 300 + i * 700));
    RUNTIME.later(() => {
      seqEl.innerHTML = seq.map(() => '<span>❓</span>').join('');
      btns.forEach(b => { b.disabled = false; });
      ready = true;
    }, 300 + len * 700 + 500);
    const press = i => {
      if(!ready || got.length >= len) return;
      const pos = got.length, right = MENU[i] === seq[pos];
      got.push(i);
      if(!right) miss++;
      seqEl.children[pos].textContent = MENU[i];
      seqEl.children[pos].style.opacity = right ? '1' : '.5';
      btns[i].classList.add(right ? 'ok' : 'bad');
      RUNTIME.later(() => btns[i].classList.remove('ok', 'bad'), 250);
      SFX.play(right ? 'success' : 'fail');
      if(got.length === len){
        ready = false;
        const pts = miss === 0 ? 2 : miss === 1 ? 1 : 0;
        total += pts;
        fb.innerHTML = pts === 2 ? '<span style="color:#fbbf24;">✦✦ 全部記對！</span>'
                     : pts === 1 ? '<span style="color:#38bdf8;">✦ 小失誤，還不錯！</span>'
                     : '<span style="color:#f87171;">✦ 記錯太多了...</span>';
        RUNTIME.later(() => round(idx + 1), 900);
      }
    };
    btns.forEach((b, i) => { b.onclick = () => press(i); });
    RUNTIME.listen(e => { if(/^[1-6]$/.test(e.key)) press(Number(e.key) - 1); });
  };
  round(0);
}

// 玩法 3：收銀找零速算
function runChangeGame(done){
  const JOB = '大學便利店';
  let total = 0;
  const round = idx => {
    if(idx >= 3) return done(total, JOB);
    const price = (5 + Math.floor(Math.random() * 95)) * 5;
    const bills = [100, 200, 500, 1000].filter(b => b > price);
    const paid = bills[Math.floor(Math.random() * Math.min(2, bills.length))];
    const ans = paid - price, set = new Set([ans]);
    while(set.size < 3){ const v = ans + pick([-100, -50, -10, -5, 5, 10, 50, 100]); if(v > 0) set.add(v); }
    const options = [...set].sort(() => Math.random() - 0.5).map(v => `$${v}`);
    askChoice({
      icon: '🧮', job: JOB, name: '收銀找零速算', idx,
      prompt: `顧客消費 <b>$${price}</b>，付了 <b>$${paid}</b>，應找零多少？`,
      options, correct: options.indexOf(`$${ans}`), limit: 9000 - idx * 1500
    }, pts => { total += pts; round(idx + 1); });
  };
  round(0);
}

// 玩法 4：倉庫搬貨連打（點擊或狂按空白鍵）
function runTapGame(done){
  const JOB = '連鎖餐廳後廚', LIMIT = 4000, baseTargets = [14, 18, 22];
  let total = 0;
  const round = idx => {
    if(idx >= 3) return done(total, JOB);
    RUNTIME.clearTimers();
    const target = Math.max(10, baseTargets[idx] - Math.floor(G.s.sk / 40));
    let taps = 0, started = false, over = false;
    openModal(`
      <div class="qte-modal">
        <div class="qte-title">📦 ${JOB} · 倉庫搬貨連打</div>
        <p class="qte-scene">第 ${idx + 1} / 3 輪：${LIMIT / 1000} 秒內搬完 ${target} 箱貨<br><small style="color:var(--mu);">狂點按鈕或連按空白鍵，第一下開始計時！</small></p>
        <div class="mg-timer"><i id="tap-time"></i></div>
        <div class="tap-count"><b id="tap-n">0</b> / ${target}</div>
        <div class="mg-timer"><i id="tap-fill" style="transform:scaleX(0);background:linear-gradient(90deg,#fbbf24,#f97316);"></i></div>
        <button class="qte-hit-btn" id="tap-btn">📦 搬！</button>
        <div id="qte-feedback" style="font-size:16px;font-weight:700;margin-top:12px;height:24px;"></div>
      </div>`, false);
    const btn = $('tap-btn'), timeEl = $('tap-time'), fillEl = $('tap-fill'), nEl = $('tap-n'), fb = $('qte-feedback');
    const finish = () => {
      if(over) return;
      over = true;
      const pts = taps >= target ? 2 : taps >= Math.ceil(target * 0.7) ? 1 : 0;
      total += pts;
      btn.disabled = true;
      fb.innerHTML = pts === 2 ? '<span style="color:#fbbf24;">✦✦ 搬運完成！動作俐落！</span>'
                   : pts === 1 ? '<span style="color:#38bdf8;">✦ 差一點點，還算及格！</span>'
                   : '<span style="color:#f87171;">✦ 手速不夠，貨還堆在地上...</span>';
      SFX.play(pts === 2 ? 'great' : pts === 1 ? 'success' : 'fail');
      RUNTIME.later(() => round(idx + 1), 900);
    };
    const hit = () => {
      if(over) return;
      if(!started){
        started = true;
        timeEl.style.transition = `transform ${LIMIT}ms linear`;
        requestAnimationFrame(() => { timeEl.style.transform = 'scaleX(0)'; });
        RUNTIME.later(finish, LIMIT);
      }
      taps++;
      nEl.textContent = taps;
      fillEl.style.transform = `scaleX(${Math.min(1, taps / target)})`;
      SFX.play('click');
      if(taps >= target) finish();
    };
    RUNTIME.later(() => { if(!started) finish(); }, 6000);
    btn.addEventListener('mousedown', e => e.preventDefault());     // 避免按鈕取得焦點後空白鍵重複觸發
    btn.addEventListener('pointerdown', hit);
    RUNTIME.listen(e => { if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat) hit(); } });
  };
  round(0);
}

// 玩法 5：臨場應對問答（每個職場 5 題隨機抽 3 題）
function runScenarioGame(done){
  const g = pick(MG);
  const qs = [...g.q].sort(() => Math.random() - 0.5).slice(0, 3);
  let total = 0;
  const round = idx => {
    if(idx >= qs.length) return done(total, g.job);
    const [text, opts, ans] = qs[idx];
    const shuffled = opts.map((t, i) => ({ t, i })).sort(() => Math.random() - 0.5);
    askChoice({
      icon: '💬', job: g.job, name: '臨場應對問答', idx, prompt: escapeHTML(text),
      options: shuffled.map(o => o.t), correct: shuffled.findIndex(o => o.i === ans), limit: 12000
    }, pts => { total += pts; round(idx + 1); });
  };
  round(0);
}

const WORK_GAMES = {

};

function miniGame(){
  const type = pick(Object.keys(WORK_GAMES).filter(k => k !== G.lastWorkGame));

}

// 打工結算：薪資公式、數值變化、贊助加班津貼
function finishWork(job, stars, type){
  let pay = CONFIG.work.base + stars * CONFIG.work.perStar;
  if(G.r === 1) pay *= 1.1;
  if(G.talentEffects.workMul) pay *= G.talentEffects.workMul;
  if(G.pet.lv >= 3) pay *= 1.15;
  if(G.aff && G.aff.boss >= 60) pay *= 1.15;
  const finalPay = Math.round(pay);
  const nightSt = (G.t === 'night') ? 2 : 0;
  const skillGain = stars >= 5 ? 2 : 1;
  const pre = { ...G.s };
  apply({ m: finalPay, sk: skillGain, st: (stars >= 5 ? 2 : 5) + nightSt });
  const realSk = G.s.sk - pre.sk, realSt = G.s.st - pre.st;
  G.workCount++;
  recordTimeline(`完成第 ${G.workCount} 次打工挑戰`);
  SFX.play('coin');
  Track.event('work_done', { type, stars });
  Ach.onWork(type, stars);
  Quest.bump('work'); if(stars >= 5) Quest.bump('star5');
  closeModal();

  const praise = stars >= 5 ? '店長大讚：「這表現簡直像資深員工一樣俐落！」'
               : stars >= 3 ? '店長點點頭：「不錯喔，繼續保持！」'
               : '店長苦笑：「新手難免失誤，下次加油！」';
  const back = () => { G.log = `在${job}完成「${WORK_GAMES[type].name}」，獲得 ${stars} 星評價。`; renderTurn(); showFloat('work', pre); saveRunState(); };
  const choices = [{ t: '回到校園繼續生活', cb: back }];
  const bonus = Math.round(finalPay * CONFIG.work.adBonusRate);
  if((G.adWorkBonus || 0) < CONFIG.work.adBonusMaxPerRun && Monetize.available('work_bonus')){
    choices.push({
      t: Monetize.btnText('work_bonus', `加班津貼 +$${bonus.toLocaleString()}（每局限 ${CONFIG.work.adBonusMaxPerRun} 次）`),
      cb: () => watchRewardedAd('加班津貼加碼', `額外獲得 $${bonus.toLocaleString()} 打工津貼`, () => {
        G.adWorkBonus = (G.adWorkBonus || 0) + 1;
        apply({ m: bonus });
        SFX.play('coin');
        back();
      }, 'work_bonus')
    });
  }
  return card({
    t: `${job} · ${WORK_GAMES[type].name}`,
    x: `打工結束！\n總評價星級：${stars} / 6 星！\n實領薪資：$${finalPay.toLocaleString()} 元（技能${fmtSigned(realSk)}，壓力${fmtSigned(realSt)}${nightSt ? ' [含深夜班表+2]' : ''}）。\n${praise}`,
    c: choices
  });
}

function card({ t, x, c, npc, nm }){
  show('s-card');
  setScene(G?.sceneAction || 'study');
  const vnBox = $('vn');
  if(vnBox){ vnBox.style.opacity = '1'; vnBox.style.pointerEvents = 'auto'; }

  np.classList.toggle('hid', !npc);

    const npcPortrait=createPortrait('np', 'npc_' + npc, ['normal', 'happy', 'tired']);
    npcPortrait.setMood(nm || 'normal');npcPortrait.setNpcOutfit(G?.npcOutfit?.[npc]||0);
  }
  const speaker = npc ? `${t} · ${NPCN[npc]||npc}` : t;
  $('ct').textContent = speaker;
  
  // 紀錄歷史對話
  VN_STATE.history.push({ speaker, text: x });
  if(VN_STATE.history.length > 50) VN_STATE.history.shift();

  const cb = $('cb');
  cb.innerHTML = '';
  cb.classList.add('hid');

  c.forEach(o => {
    const b = document.createElement('button');
    b.innerHTML = `<span>${o.t}</span>` + (o.h ? ` <span class="hint">${o.h}</span>` : '');
    b.onclick = e => {
      e.stopPropagation();
      SFX.play('click');
      clearTimeout(VN_STATE.autoTimer);
      o.cb();
    };
    cb.appendChild(b);
  });

  const el = $('cx');
  clearInterval(tw);
  let i = 0, done = false;
  const fin = () => {
    if(done) return;
    done = true;
    clearInterval(tw);
    el.textContent = x;
    cb.classList.remove('hid');

    // 自動播放推進
    if(VN_STATE.isAuto && c && c.length === 1){
      clearTimeout(VN_STATE.autoTimer);
      VN_STATE.autoTimer = setTimeout(() => {
        c[0].cb();
      }, 2200);
    }
  };
  el.textContent = '';
  tw = setInterval(() => {
    el.textContent = x.slice(0, ++i);
    if(i % 3 === 0) SFX.play('type');
    if(i >= x.length) fin();
  }, 22);

  $('vn').onclick = fin;
}

// 月底/期末生活事件隊列
function endMonth(){
  SFX.play('flip');
  if(G.settlePhase==='lottery-result'){beginMonthlyEvents();return;}
  if(G.settlePhase==='lottery'){runInvoiceLottery(() => beginMonthlyEvents());return;}
  G.settlePhase='lottery';saveRunState();
  
  if(G.pet.lv >= 2){
    const treasures = [
      { name:'貓貓帶回的私房錢 $300', fx:{ m:300 } },
      { name:'咪寶撿到學長遺落的提神飲料！', fx:{}, item:'drink' },
      { name:'咪寶在花圃發現的幸運御守！', fx:{}, item:'amulet' }
    ];
    const tr = pick(treasures);
    if(tr.item) G.bag[tr.item] = (G.bag[tr.item] || 0) + 1;
    if(tr.fx) apply(tr.fx);
    showToast(`咪寶散步回來，叼回了：${tr.name}！`,I('cat'));
    saveRunState();
  }

  runInvoiceLottery(() => beginMonthlyEvents());
}

function beginMonthlyEvents(){
    G.settlePhase='events';
    const n = G.r * 3;
    G.q = G.ev.slice(n, n + 3);
    const isLastRound = G.r === MON.length - 1;
    const isMidMilestone = (G.mode === 'full4' && G.r === 3) || isLastRound;

    if(isMidMilestone){
       if(G.pet.lv >= 4 && !G.triggeredSpecial.pet){ G.triggeredSpecial.pet = true; G.q.push(SPECIAL_EVENTS.pet); }
       else if(G.flags.got_intern && !G.triggeredSpecial.intern){ G.triggeredSpecial.intern = true; G.q.push(SPECIAL_EVENTS.intern); }
       else if(G.flags.took_tutor && !G.triggeredSpecial.tutor){ G.triggeredSpecial.tutor = true; G.q.push(SPECIAL_EVENTS.tutor); }
       else if(G.flags.lent_money && !G.triggeredSpecial.friendship){ G.triggeredSpecial.friendship = true; G.q.push(SPECIAL_EVENTS.friendship); }
       else if(G.flags.joined_club && G.s.sk >= 18 && !G.triggeredSpecial.club){ G.triggeredSpecial.club = true; G.q.push(SPECIAL_EVENTS.club); }
       else if(G.s.k >= (G.mode==='full4'?55:40) && !G.triggeredSpecial.scholar){ G.triggeredSpecial.scholar = true; G.q.push(SPECIAL_EVENTS.scholar); }
       else if(G.workCount >= 2 && !G.triggeredSpecial.slasher){ G.triggeredSpecial.slasher = true; G.q.push(SPECIAL_EVENTS.slasher); }
       else G.q.push(SPECIAL_EVENTS.default);
    }
    saveRunState();
    nextEv();
}

function nextEv(){
  const e = G.q[0];
  if(!e) return settle();
  SFX.play('ding');

  card({
    t: e.t,
    x: e.x,
    npc: e.npc,
    nm: 'normal',
    c: e.c.map(c => ({
      t: c.t,
      h: [choicePreview(c),hs(c)].filter(Boolean).join(' · '),
      cb: () => {
        const w = !c.bad || Math.random() < (c.p || 0.7);
        apply(w ? c.fx : c.bad);
        if(c.flag) G.flags[c.flag] = true;
        if(c.flag==='joined_club')recordTimeline('加入校園社團');
        let affNote = '';
        if(w && c.aff){
          const parts = [];
          for(const [npcId, delta] of Object.entries(c.aff)){
            const actual = addNpcAffection(npcId, Math.round(delta * affScale()));
            if(actual) parts.push(`${NPC_META[npcId]?.name || npcId}好感+${actual}`);
          }
          if(parts.length) affNote = `（${parts.join('、')}）`;
        }
        G.q.shift();saveRunState();

        card({
          t: e.t,
          x: (w ? c.r : (c.rb || c.r)) + affNote,
          npc: e.npc,
          nm: (w && (c.fx?.st||0) <= 2) ? 'happy' : 'tired',
          c: [{ t: '繼續前進', cb: () => drainBondStoryQueue(nextEv) }]
        });
      }
    }))
  });
}

function settle(){
  const resumed=G.settlePhase==='settle-result';
  const livingCost = G.mode === 'full4' ? 1800 : 1400;
  if(!resumed)apply({ m: -livingCost, st: G.pers==='chill' ? -7 : -3 });
  let broke = false;
  if(!resumed&&G.s.m < 0){
    apply({ st: 10 });
    broke = true;
  }
  if(!resumed)G.lastSettlementBroke=broke;
  if(!resumed)recordTimeline(`${MON[G.r]}${G.mode==='demo2'?'月':'學期'}生活結算完成`);
  G.settlePhase='settle-result';saveRunState();

  const last = G.r === MON.length - 1;
  const nextSemName = !last ? MON[G.r + 1] : '';
  card({
    t: `${G.name} 的 ${MON[G.r]} ${G.mode==='demo2'?'月結':'學期生活結算'}`,
    x: `固定${G.mode==='demo2'?'本月':'學期'}生活支出扣除 $${livingCost.toLocaleString()} 元，目前戶頭存款 $${Math.round(G.s.m).toLocaleString()} 元。` +
       (G.lastSettlementBroke ? '\n⚠️ 警告：存款見底赤字，心理壓力劇烈增加！' : '\n身心經過假期休整，獲得適度沉澱。'),
    c: [{
      t: last ? (G.mode === 'full4' ? '✦ 參加畢業典禮 · 查看四年總結算' : '✦ 查看大一生涯拓荒報告') : `✦ 邁入【${nextSemName}】新學期`,
      cb: () => {
        if(last) return ending();
        G.settlePhase='actions';G.lastSettlementBroke=false;
        G.r++;
        G.e = G.baseMaxE || 10;
        G.maxE = G.baseMaxE || 10;
        G.talentEffects = {};
        G.currentTalent = null;
        G.talentPending = true;
        Track.event('semester', { r: G.r });
        G.encThisSem = 0;
        G.petPetted = false;
        G.bondUsed = {};
        G.log = `✦ 【${MON[G.r]}】新學期開始了，體力已完全恢復！`;
        renderTurn();
        saveRunState();
        setTimeout(() => openTalentModal(), 400);

// ─── HTML5 Canvas 五維雷達畢業紀念圖卡生成（社交裂變分享） ───────
function openRadarShareCard(endKey, creditsEarned, bestNpcStr){
  SFX.play('ding');
  const s = G.s;
  const is4Y = G.mode === 'full4';
  const maxRef = is4Y ? 120 : 60;

  const axes = [
    { label: `學識 ${Math.round(s.k)}`,   val: norm(s.k, maxRef) },
    { label: `財富 $${Math.round(s.m/1000)}k`, val: norm(Math.max(0, s.m), is4Y ? 30000 : 15000) },
    { label: `技能 ${Math.round(s.sk)}`,  val: norm(s.sk, maxRef) },
    { label: `健康 ${Math.round(s.h)}`,   val: norm(s.h, 100) },
    { label: `抗壓 ${Math.max(0, 100 - Math.round(s.st))}`, val: norm(Math.max(0, 100 - s.st), 100) }
  ];

  openModal(`
    <h2 style="font-size:22px;color:var(--gold-t);margin-bottom:6px;">🎓 專屬大學生涯雷達紀念卡</h2>
    <p style="font-size:13px;color:var(--mu);margin-bottom:10px;">可下載高畫質 PNG 圖卡或一鍵複製戰績文案，與好友分享你的青春結局！</p>
    <canvas id="share-radar-canvas" width="800" height="480" style="width:100%;max-width:680px;border-radius:14px;border:1.5px solid var(--hoyo-gold);box-shadow:var(--sh-gold);"></canvas>
    <div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="pri" id="btn-dl-card" style="padding:10px 24px;font-size:14px;">⬇️ 下載 PNG 圖卡</button>
      <button class="hud-btn" id="btn-copy-share" style="padding:10px 20px;font-size:14px;">📋 一鍵複製戰績文案</button>
      <button class="ad-btn" id="btn-web-share" style="padding:10px 20px;font-size:14px;border-radius:99px;font-weight:bold;">🔗 分享戰績</button>
    </div>
  `);

  const canvas = $('share-radar-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');

  // 深藍星空漸層背景
  const bgGrad = ctx.createLinearGradient(0, 0, 800, 480);
  bgGrad.addColorStop(0, '#070b19');
  bgGrad.addColorStop(0.5, '#111c3a');
  bgGrad.addColorStop(1, '#1e1b4b');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 800, 480);

  // 金色雙線外框
  ctx.strokeStyle = '#f3c262';
  ctx.lineWidth = 3;
  ctx.strokeRect(16, 16, 768, 448);
  ctx.strokeStyle = 'rgba(243,194,98,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(24, 24, 752, 432);

  // 左側資訊排版
  ctx.fillStyle = '#f3c262';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(`✦ ${is4Y ? '大學四年畢業紀念卡' : '大一校園生活紀念卡'} ✦`, 44, 58);

  ctx.fillStyle = '#f8fafc';
  ctx.font = '900 32px sans-serif';
  ctx.fillText(`${G.name}`, 44, 102);

  ctx.fillStyle = '#93c5fd';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText(`${MAJOR_NAMES[G.major] || '綜合學院'} · ${is4Y ? '完整四年制畢業生' : '大一開學體驗生'}`, 44, 130);

  ctx.fillStyle = '#fde047';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(`【${END[endKey][0]}】`, 44, 176);

  // 自動換行結局描述
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '15px sans-serif';
  const desc = END[endKey][1];
  let line = '', yPos = 210;
  for(const ch of desc){
    if(ctx.measureText(line + ch).width > 370){
      ctx.fillText(line, 44, yPos);
      line = ch;
      yPos += 24;
    } else {
      line += ch;
    }
  }
  if(line) ctx.fillText(line, 44, yPos);

  // 底部徽章資訊
  ctx.fillStyle = 'rgba(243,194,98,0.14)';
  ctx.fillRect(44, 305, 370, 118);
  ctx.strokeStyle = 'rgba(243,194,98,0.5)';
  ctx.strokeRect(44, 305, 370, 118);

  ctx.font = 'bold 15px sans-serif';
  ctx.fillText(`🐱 守護萌寵：${getActivePetSkin().name} (Lv.${G.pet.lv})`, 60, 335);
  ctx.fillText(`🤝 最佳羈絆：${bestNpcStr}`, 60, 365);
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(`🎖️ 本局星輝學分幣：+${creditsEarned} 點`, 60, 395);
  ctx.fillStyle = '#f3c262';ctx.font='bold 13px sans-serif';ctx.fillText('📖 校園大事紀',60,424);
  ctx.fillStyle = '#cbd5e1';ctx.font='12px sans-serif';
  (G.timeline||[]).slice(-2).forEach((item,index)=>ctx.fillText('✦ '+item.text.slice(0,36),60,444+index*18));
  // 先畫 SVG 風格的學士服備援，再嘗試以透明 PNG 覆蓋；缺圖時分享卡仍有主角插畫。
  ctx.fillStyle='#1e3a8a';ctx.beginPath();ctx.moveTo(716,192);ctx.quadraticCurveTo(726,120,770,120);ctx.quadraticCurveTo(814,120,824,192);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f3c262';ctx.beginPath();ctx.moveTo(745,91);ctx.lineTo(770,78);ctx.lineTo(795,91);ctx.lineTo(770,104);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(770,112,21,0,Math.PI*2);ctx.fill();
  const gradBase=new Image();gradBase.onload=()=>{ctx.drawImage(gradBase,716,75,108,128);const gradOutfit=new Image();gradOutfit.onload=()=>ctx.drawImage(gradOutfit,716,75,108,128);gradOutfit.src='assets/'+ASSET_MANIFEST.outfits.graduation+'/char_'+(G.gender||'male')+'.png';};gradBase.src='assets/char_'+(G.gender||'male')+'_happy.webp';

  // 右側五維雷達圖
  const cx = 605, cy = 248, rad = 122;
  const N = axes.length;
  const angleOf = i => -Math.PI / 2 + (i * 2 * Math.PI) / N;

  // 繪製 4 層同心五邊形網格
  for(let lv = 1; lv <= 4; lv++){
    const r = (rad * lv) / 4;
    ctx.beginPath();
    for(let i = 0; i < N; i++){
      const ang = angleOf(i);
      const px = cx + r * Math.cos(ang);
      const py = cy + r * Math.sin(ang);
      if(i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 繪製放射軸線與標籤
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#e2e8f0';
  ctx.textAlign = 'center';
  for(let i = 0; i < N; i++){
    const ang = angleOf(i);
    const px = cx + rad * Math.cos(ang);
    const py = cy + rad * Math.sin(ang);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(px, py);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
    ctx.stroke();

    const lx = cx + (rad + 28) * Math.cos(ang);
    const ly = cy + (rad + 22) * Math.sin(ang) + 5;
    ctx.fillText(axes[i].label, lx, ly);
  }

  // 繪製能力多邊形區域
  ctx.beginPath();
  for(let i = 0; i < N; i++){
    const ang = angleOf(i);
    const r = rad * axes[i].val;
    const px = cx + r * Math.cos(ang);
    const py = cy + r * Math.sin(ang);
    if(i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(251, 191, 36, 0.32)';
  ctx.fill();
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 繪製頂點光點
  for(let i = 0; i < N; i++){
    const ang = angleOf(i);
    const r = rad * axes[i].val;
    const px = cx + r * Math.cos(ang);
    const py = cy + r * Math.sin(ang);
    ctx.beginPath();
    ctx.arc(px, py, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
  ctx.textAlign = 'left';

  ctx.strokeStyle='#f3c262';ctx.lineWidth=1.5;ctx.strokeRect(694,58,82,82);
  ctx.fillStyle='#f3c262';ctx.font='bold 11px sans-serif';ctx.fillText('結局紀念 CG',694,52);
  ctx.fillStyle='rgba(243,194,98,.25)';ctx.fillRect(696,60,78,78);
  ctx.fillStyle='#f8fafc';ctx.font='28px sans-serif';ctx.fillText('✦',719,103);
  const endingCg=new Image();endingCg.onload=()=>ctx.drawImage(endingCg,696,60,78,78);endingCg.src='assets/'+ASSET_MANIFEST.endings[endKey];

  const shareSummary = `🎓【大學四年模擬遊戲】${G.name}（${MAJOR_NAMES[G.major] || '綜合學院'}）達成結局【${END[endKey][0]}】！\n📊 學識 ${Math.round(s.k)}｜存款 $${Math.round(s.m).toLocaleString()}｜技能 ${Math.round(s.sk)}｜健康 ${Math.round(s.h)}\n🐱 守護萌寵：${getActivePetSkin().name} (Lv.${G.pet.lv})｜🤝 最佳羈絆：${bestNpcStr}`;

  const dlBtn = $('btn-dl-card');
  if(dlBtn){
    dlBtn.onclick = () => {
      const link = document.createElement('a');
      link.download = `${G.name}_大學模擬畢業紀念卡.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      SFX.play('success');
      showGlobalNotice('📸 已下載畢業紀念圖卡！快分享給朋友吧！');
    };
  }

  const copyBtn = $('btn-copy-share');
  if(copyBtn){
    copyBtn.onclick = async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(shareSummary);
        } else {
          const ta = document.createElement('textarea');
          ta.value = shareSummary;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        SFX.play('success');
        showGlobalNotice('📋 已複製畢業戰績文案到剪貼簿！');
      } catch (e) {
        showGlobalNotice('複製失敗，請手動截圖或下載圖卡分享', true);
      }
    };
  }

  const shareBtn = $('btn-web-share');
  if(shareBtn){
    shareBtn.onclick = async () => {
      try {
        if (navigator.share) {
          const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
          const file = blob ? new File([blob], `${G.name}_大學模擬畢業紀念卡.png`, { type: 'image/png' }) : null;
          if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ title: '大學四年模擬遊戲 · 畢業紀念卡', text: shareSummary, files: [file] });
          } else {
            await navigator.share({ title: '大學四年模擬遊戲 · 畢業紀念卡', text: shareSummary });
          }
          SFX.play('success');
        } else {
          if (copyBtn) copyBtn.click();
        }
      } catch (e) {
        if (e && e.name !== 'AbortError' && copyBtn) copyBtn.click();
      }
    };
  }
}

const Quest = {
  QUEST_BONUS: 15,
  state(){
    const today = Track.dayKey();
    let s = Store.get(KEYS.quests, null);
    if(!s || s.day !== today){
      const list = [...QUEST_POOL].sort(() => Math.random() - 0.5).slice(0, 3).map(q => ({ id: q.id, prog: 0, done: false, claimed: false }));
      s = { day: today, list, bonus: false };
      Store.set(KEYS.quests, s);
    }
    return s;
  },
  def(id){ return QUEST_POOL.find(q => q.id === id); },
  bump(ev, n = 1){
    const s = this.state();
    let changed = false;
    s.list.forEach(q => {
      const d = this.def(q.id);
      if(d.ev === ev && !q.done){
        q.prog = Math.min(d.need, q.prog + n);
        if(q.prog >= d.need){ q.done = true; showGlobalNotice(`📋 任務完成：${d.text}！到任務欄領取獎勵`); }
        changed = true;
      }
    });
    if(changed){ Store.set(KEYS.quests, s); this.refresh(); }
  },
  claimable(){ return this.state().list.some(q => q.done && !q.claimed); },
  claim(id){
    const s = this.state(), q = s.list.find(x => x.id === id);
    if(!q || !q.done || q.claimed) return;
    q.claimed = true;
    setCredits(getCredits() + this.def(id).reward);
    SFX.play('coin');
    if(s.list.every(x => x.claimed) && !s.bonus){
      s.bonus = true;
      setCredits(getCredits() + this.QUEST_BONUS);
      Ach.unlock('quest_all');
      showGlobalNotice(`🎉 今日任務全清！額外獲得 ${this.QUEST_BONUS} 學分幣`);
    }
    Store.set(KEYS.quests, s);
    Track.event('quest_claim', { id });
    this.refresh();
    this.open();
  },
  refresh(){
    const dot = this.claimable() ? '❗' : '';
    const b = $('btn-quest'); if(b) b.textContent = '📋' + dot;
    const b2 = $('questBtn'); if(b2) b2.textContent = '📋 每日任務' + dot;
  },
  open(){
    const s = this.state();
    const rows = s.list.map(q => {
      const d = this.def(q.id), pct = Math.round(q.prog / d.need * 100);
      return `
        <div class="quest-row ${q.claimed ? 'claimed' : ''}">
          <span style="font-size:24px;">${d.icon}</span>
          <div style="flex:1;text-align:left;">
            <b style="font-size:14px;">${d.text}</b>
            <div class="mg-timer" style="margin:5px 0 2px;"><i style="transform:scaleX(${pct / 100});background:linear-gradient(90deg,#fbbf24,#f97316);"></i></div>
            <small style="color:var(--mu);">${q.prog} / ${d.need} · 獎勵 ${d.reward} 學分幣</small>
          </div>
          ${q.claimed ? '<button disabled style="padding:6px 12px;font-size:12px;">已領取</button>'
            : q.done ? `<button class="pri" style="padding:6px 12px;font-size:12px;" onclick="Quest.claim('${q.id}')">領取</button>`
            : '<button disabled style="padding:6px 12px;font-size:12px;">進行中</button>'}
        </div>`;
    }).join('');
    openModal(`
      <h2 style="color:var(--gold-t);letter-spacing:2px;margin-bottom:4px;">📋 每日任務</h2>
      <p style="font-size:13px;color:var(--mu);">每天 3 個新任務，進行任何一局都會累計 · 全部完成再送 ${this.QUEST_BONUS} 學分幣</p>
      <div class="quest-list">${rows}</div>`, true);
  }
};

  roll(k){
    if(!G || k === 'end' || k === 'shop') return;
    G.actsSinceEnc = (G.actsSinceEnc || 0) + 1;
    if(G.actsSinceEnc >= 3 && (G.encThisSem || 0) < 2 && Math.random() < 0.2) G.encRoll = true;
  },
  tries: 0,
  run(){
    const busy = !$('modal-layer').classList.contains('hid') || $('s-turn').classList.contains('hid');
    if(busy){ if(this.tries++ < 6) setTimeout(() => this.run(), 800); return; }
    this.tries = 0;
    G.encSeen = G.encSeen || [];
    let pool = ENCOUNTERS.filter(e => !G.encSeen.includes(e.id));
    if(!pool.length){ G.encSeen = []; pool = ENCOUNTERS; }
    const e = pick(pool);
    G.encSeen.push(e.id);
    G.actsSinceEnc = 0; G.encThisSem = (G.encThisSem || 0) + 1;
    Track.event('encounter', { id: e.id });
    Quest.bump('encounter'); Ach.bump('encounters');
    SFX.play('click');
    card({
      t: `✦ 校園巧遇 · ${e.title}`, x: e.text,

// ═══ 畫面動態效果：依時段飄落櫻花／暮光塵埃／夜晚螢火蟲 ═══
const Fx = {
  cv: null, ctx: null, parts: [], raf: 0, mode: 'day', last: 0,
  init(){
    this.cv = $('fx-canvas');
    if(!this.cv) return;
    this.ctx = this.cv.getContext('2d');
    this.cv.width = 1280; this.cv.height = 714;
    this.sync();
  },
  enabled(){ return Settings.fx && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); },
  setMode(t){ this.mode = t; this.parts = []; this.spawn(); },
  spawn(){
    const n = this.mode === 'night' ? 22 : this.mode === 'dusk' ? 26 : 20;
    while(this.parts.length < n) this.parts.push(this.make(true));
  },
  make(anywhere){
    const m = this.mode, r = Math.random;
    const p = { x: r() * 1280, y: anywhere ? r() * 714 : -20, ph: r() * 6.28, sp: 0.4 + r() * 0.8, sz: 3 + r() * 4 };
    if(m === 'night'){ p.y = r() * 714; p.sz = 1.6 + r() * 1.8; }
    return p;
  },
  sync(){
    cancelAnimationFrame(this.raf);
    if(!this.cv) return;
    this.cv.style.display = this.enabled() ? 'block' : 'none';
    if(!this.enabled()){ this.ctx.clearRect(0, 0, 1280, 714); return; }
    this.spawn();
    this.last = 0;
    this.raf = requestAnimationFrame(ts => this.loop(ts));
  },
  loop(ts){
    if(!this.enabled()) return;
    this.raf = requestAnimationFrame(t => this.loop(t));
    if(document.hidden || $('s-turn').classList.contains('hid')) return;
    if(ts - this.last < 33) return;            // 約 30fps
    const dt = Math.min(0.1, (ts - this.last) / 1000 || 0.033);
    this.last = ts;
    const c = this.ctx, m = this.mode;
    c.clearRect(0, 0, 1280, 714);
    this.parts.forEach((p, i) => {
      p.ph += dt * 1.6;
      if(m === 'night'){
        p.x += Math.sin(p.ph * 0.7) * 12 * dt; p.y += Math.cos(p.ph * 0.5) * 9 * dt;
        const a = 0.35 + 0.65 * Math.abs(Math.sin(p.ph));
        c.fillStyle = `rgba(253,230,138,${a})`; c.shadowColor = 'rgba(253,230,138,.9)'; c.shadowBlur = 10;
        c.beginPath(); c.arc(p.x, p.y, p.sz, 0, 6.28); c.fill();
        c.shadowBlur = 0;
      } else {
        p.y += p.sp * 38 * dt; p.x += Math.sin(p.ph) * 22 * dt + 10 * dt;
        c.save(); c.translate(p.x, p.y); c.rotate(p.ph);
        c.fillStyle = m === 'dusk' ? 'rgba(253,186,116,.55)' : (i % 3 ? 'rgba(255,255,255,.55)' : 'rgba(251,182,206,.7)');
        c.beginPath(); c.ellipse(0, 0, p.sz, p.sz * 0.55, 0, 0, 6.28); c.fill();
        c.restore();
        if(p.y > 740 || p.x > 1320){ Object.assign(p, this.make(false)); }
      }
    });
  }
};

// 點擊漣漪：所有按鈕共用
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('button');
  if(!b || b.classList.contains('pin') || b.disabled || !Settings.fx) return;
  const r = b.getBoundingClientRect(), sc = r.width / (b.offsetWidth || r.width) || 1;
  const d = Math.max(r.width, r.height) / sc * 1.6;
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.cssText = `width:${d}px;height:${d}px;left:${(e.clientX - r.left) / sc - d / 2}px;top:${(e.clientY - r.top) / sc - d / 2}px;`;
  b.appendChild(s);
  setTimeout(() => s.remove(), 550);
});

const Daily = {
  // 簽到獎勵：終身贊助者 +50%、學園通行證 +20
  rewardFor(idx){
    let r = CONFIG.daily[idx % CONFIG.daily.length];
    if(Entitlements.has('vip')) r = Math.round(r * 1.5);
    if(Entitlements.has('pass')) r += 20;
    return r;
  },
  status(){
    const s = Store.get(KEYS.daily, { last: '', streak: 0 }), today = Track.dayKey();
    if(s.last === today) return { claimed: true, streak: s.streak };
    const gap = s.last ? Math.round((new Date(today + 'T00:00:00') - new Date(s.last + 'T00:00:00')) / 86400000) : 99;
    return { claimed: false, streak: gap === 1 ? s.streak : 0 };
  },
  claim(multiplier = 1){
    const st = this.status();
    if(st.claimed) return;
    const streak = st.streak + 1, reward = this.rewardFor(streak - 1) * multiplier;
    Store.set(KEYS.daily, { last: Track.dayKey(), streak });
    setCredits(getCredits() + reward);
    Track.event('checkin', { streak, reward });
    if(streak >= 3) Ach.unlock('streak3');
    if(streak >= 7) Ach.unlock('streak7');
    Meta.refresh();
    showGlobalNotice(`📅 簽到成功！獲得 ${reward} 點星輝學分幣`);
    this.open();
  },
  open(){
    const st = this.status();
    const done = st.claimed ? ((st.streak - 1) % 7) + 1 : (st.streak % 7);
    const reward = this.rewardFor(st.claimed ? done - 1 : done);
    const cells = CONFIG.daily.map((r, i) => `
      <div class="checkin-day ${i < done ? 'done' : ''} ${!st.claimed && i === done ? 'today' : ''}">
        <div>第 ${i + 1} 天</div><b style="font-size:18px;">${i < done ? '✅' : '🎖️'}</b><div>+${r}</div>
      </div>`).join('');
    openModal(`
      <h2 style="color:var(--gold-t);letter-spacing:2px;margin-bottom:4px;">📅 每日簽到</h2>
      <p style="font-size:14px;color:var(--mu);">連續簽到 <b style="color:var(--ink);">${st.streak}</b> 天 · 每天登入都能領星輝學分幣，用來升級榮譽殿堂</p>
      <div class="checkin-grid">${cells}</div>
      ${st.claimed
        ? '<p style="font-size:14px;color:var(--mu);">今天已簽到完成，明天再來領取下一份獎勵！</p>'
        : `<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
             <button class="pri" id="daily-claim" style="padding:10px 22px;font-size:15px;">領取 +${reward} 學分幣</button>
             ${Monetize.available('checkin_double') ? `<button class="ad-btn" id="daily-double" style="padding:10px 18px;border-radius:99px;font-size:13px;font-weight:bold;">${Monetize.btnText('checkin_double', `雙倍領取 (+${reward * 2})`)}</button>` : ''}
           </div>`}`, true);
    if(!st.claimed){
      $('daily-claim').onclick = () => this.claim(1);
      if($('daily-double')) $('daily-double').onclick = () => watchRewardedAd('每日簽到雙倍加碼', `簽到獎勵翻倍（+${reward * 2} 學分幣）`, () => this.claim(2), 'checkin_double');
    }
  }
};

const Ach = {
  queue: [], busy: false,
  load(){ return Store.get(KEYS.ach, {}); },
  counters(){ return Store.get(KEYS.counters, {}); },
  bump(name, n = 1){
    const c = this.counters();
    c[name] = (c[name] || 0) + n;
    Store.set(KEYS.counters, c);
    if(c.quiz_correct >= 20) this.unlock('quiz20');
    if((c.ads || 0) + (c.energy_exchange || 0) >= 3) this.unlock('ads3');
    if(c.quiz_perfect >= 3) this.unlock('quiz_ace');
    if(c.encounters >= 5) this.unlock('enc5');
    if(c.pokes >= 30) this.unlock('poker');
  },
  unlock(id){
    const u = this.load(), def = ACH_DEFS.find(a => a.id === id);
    if(!def || u[id]) return false;
    u[id] = Date.now();
    Store.set(KEYS.ach, u);
    setCredits(getCredits() + def.reward);
    Track.event('achievement', { id });
    this.queue.push(def);
    this.pump();
    Meta.refresh();
    return true;
  },
  pump(){
    if(this.busy || !this.queue.length) return;
    this.busy = true;
    const d = this.queue.shift();
    showGlobalNotice(`🏅 成就解鎖：${d.name}（+${d.reward} 學分幣）`);
    setTimeout(() => { this.busy = false; this.pump(); }, 2800);
  },
  onWork(type, stars){
    if(stars >= 6) this.unlock('perfect_shift');
    const played = Store.get(KEYS.games, {});
    played[type] = 1;
    Store.set(KEYS.games, played);
    if(Object.keys(played).length >= Object.keys(WORK_GAMES).length) this.unlock('all_games');
  },
  onRunEnd(){
    this.unlock('first_grad');
    if(G.workCount >= 5) this.unlock('busy_bee');
    if(G.s.m >= 30000) this.unlock('rich');
    if(G.s.k >= 100) this.unlock('scholar');
    if(G.pet.lv >= 3) this.unlock('pet3');
    if(Object.values(G.aff).some(v => v >= 80)) this.unlock('bond');
    const n = Object.keys(dexLoad()).length;
    if(n >= 3) this.unlock('dex3');
    if(n >= Object.keys(END).length) this.unlock('dex_all');
  },
  open(){
    const u = this.load();
    const items = ACH_DEFS.map(a => `
      <div class="ach-item ${u[a.id] ? 'on' : ''}">
        <span style="font-size:22px;">${u[a.id] ? a.icon : '🔒'}</span>

function previewOutfit(id){
  if(!ASSET_MANIFEST.outfits[id])return;
  OUTFIT_PREVIEW?.setOutfit(id);
}

function buyOutfit(id){
  const item=OUTFIT_CATALOG[id];
  if(!item)return;
  const skins=loadSkins();
  if(skins.ownedOutfits.includes(id)){tryOnOutfit(id);return;}
  const balance=getCredits();
  if(balance<item.price){SFX.play('fail');showGlobalNotice(`學分幣不足，解鎖【${item.name}】需要 ${item.price} 枚。`,true);return;}
  setCredits(balance-item.price);
  skins.ownedOutfits.push(id);saveSkins(skins);
  showGlobalNotice(`已解鎖【${item.name}】，花費 ${item.price} 枚星輝學分幣。`);
  tryOnOutfit(id);
}

function tryOnOutfit(id){
  if(!ASSET_MANIFEST.outfits[id])return;
  const skins=loadSkins();
  if(!skins.ownedOutfits.includes(id)){showGlobalNotice('先解鎖這套服裝，才能穿上。',true);return;}
  skins.activeOutfit=id;saveSkins(skins);
  G?.pp?.setOutfit(id);G?.cp?.setOutfit(id);openHonorHallModal('outfits');
}
function tryOnAccessory(id){
  const skins=loadSkins();skins.activeAccessory=ASSET_MANIFEST.accessories[id]?id:'';saveSkins(skins);
  G?.pp?.setAccessory(skins.activeAccessory);G?.cp?.setAccessory(skins.activeAccessory);openHonorHallModal('outfits');
}

function buyHonorUpgrade(id){
  const def = UPGRADE_DEFS.find(x => x.id === id);
  if(!def) return;
  const upgs = loadUpgrades();
  const curLv = upgs[id] || 0;
  if(curLv >= def.max) return;
  const cost = def.costs[curLv];
  const credits = getCredits();
  if(credits < cost){
    SFX.play('fail');
    showGlobalNotice(`星輝學分幣不足（需要 ${cost} 點，目前 ${credits} 點）！完成一局即可獲得學分幣！`, true);
    return;
  }
  setCredits(credits - cost);
  upgs[id] = curLv + 1;
  saveUpgrades(upgs);
  SFX.play('great');
  openHonorHallModal('upgrades');
}

function selectOrBuySkin(type, id){
  const skins = loadSkins();
  const list = type === 'pet' ? PET_SKINS : HALO_SKINS;
  const ownedArr = type === 'pet' ? skins.ownedPet : skins.ownedHalo;
  const item = list.find(x => x.id === id);
  if(!item) return;

  if(!ownedArr.includes(id) && item.premium){ Shop.open(); return; }
  if(!ownedArr.includes(id)){
    const credits = getCredits();
    if(credits < item.cost){
      SFX.play('fail');
      showGlobalNotice(`星輝學分幣不足（需要 ${item.cost} 點，目前 ${credits} 點）！`, true);
      return;
    }
    setCredits(credits - item.cost);
    ownedArr.push(id);
    SFX.play('great');
  } else {
    SFX.play('click');
  }

  if(type === 'pet') skins.activePet = id;
  else skins.activeHalo = id;
  saveSkins(skins);
  openHonorHallModal('skins');
}

// ─── 中途自動存檔與讀檔系統 (Auto-Save & Resume) ─────────────
const SAVE_KEY = KEYS.autosave;

function saveRunState(){
  if(!G) return;
  try {
    const serializable = { ...G };
    delete serializable.pp;
    delete serializable.cp;
    serializable.schemaVersion = SAVE_SCHEMA_VERSION;
    serializable.savedAt = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(serializable));
  } catch(e){
    showGlobalNotice('自動存檔失敗，這次進度可能無法恢復。', true);
  }
}

function loadRunState(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(
      !data ||
      !data.s ||
      !Array.isArray(data.sems) ||
      data.sems.length === 0 ||
      !data.sems.every(sem => sem && typeof sem.code === 'string')
    ) return null;
    return data;
  } catch(e) {
    showGlobalNotice('讀取本機存檔失敗，將略過損壞的存檔。', true);
    return null;
  }
}

function clearRunState(){
  try { localStorage.removeItem(SAVE_KEY); }
  catch(e){ showGlobalNotice('清除本機存檔失敗，請稍後再試。', true); }
  updateResumeUI();
}

function updateResumeUI(){
  const wrap = $('resume-wrap');
  const btn = $('resumeBtn');
  if(!wrap || !btn) return;
  const saved = loadRunState();
  if(saved){
    const semCode = saved.sems[saved.r]?.code || '進行中';
    btn.textContent = `📂 繼續上次進度（${semCode} · 體力 ${saved.e}/${saved.maxE || 10}）`;
    wrap.classList.remove('hid');
  } else {
    wrap.classList.add('hid');
  }
}

// 舊版／損毀存檔補齊欄位，避免讀檔後 undefined 讓遊戲卡死
function normalizeSave(g){
  g.schemaVersion = SAVE_SCHEMA_VERSION;
  g.mode = g.mode === 'demo2' ? 'demo2' : 'full4';
  g.major = QUIZ[g.major] ? g.major : 'cs';
  g.s = Object.assign({ k: 20, m: 0, sk: 10, h: 70, st: 25 }, g.s || {});
  ['k', 'm', 'sk', 'h', 'st'].forEach(key => {
    if(!Number.isFinite(Number(g.s[key]))) g.s[key] = { k: 20, m: 0, sk: 10, h: 70, st: 25 }[key];
    g.s[key] = Number(g.s[key]);
  });
  g.aff = Object.assign({ kai: 20, yu: 15, boss: 10 }, g.aff || {});
  ['kai', 'yu', 'boss'].forEach(key => {
    if(!Number.isFinite(Number(g.aff[key]))) g.aff[key] = { kai: 20, yu: 15, boss: 10 }[key];
    g.aff[key] = cl(Number(g.aff[key]), 0, 100);
  });
  g.pet = Object.assign({ name: '咪寶', lv: 1, love: 0 }, g.pet || {});
  g.wealth = ['poor','middle','rich'].includes(g.wealth) ? g.wealth : 'middle';
  g.timeline = Array.isArray(g.timeline) ? g.timeline : [];
  g.settlePhase = g.settlePhase || 'actions';
  g.pet.lv = cl(Number.isFinite(Number(g.pet.lv)) ? Number(g.pet.lv) : 1, 1, 5);
  g.pet.love = cl(Number.isFinite(Number(g.pet.love)) ? Number(g.pet.love) : 0, 0, 100);
  g.bag = g.bag || {};
  g.bagBuffs = g.bagBuffs || {};
  g.talentEffects = g.talentEffects || {};
  g.flags = g.flags || {};
  g.triggeredSpecial = g.triggeredSpecial || {};
  g.petMem = g.petMem || {};
  g.bondUsed = g.bondUsed || {};
  g.bondStorySeen=g.bondStorySeen||{kai:{},yu:{},boss:{}};
  ['kai','yu','boss'].forEach(id=>g.bondStorySeen[id]=g.bondStorySeen[id]||{});
  g.bondStoryQueue=Array.isArray(g.bondStoryQueue)?g.bondStoryQueue.filter(x=>NPC_META[x?.npcId]&&[35,60,80].includes(Number(x.level))):[];
  g.npcOutfit=g.npcOutfit||{};
  g.quizSeen = Array.isArray(g.quizSeen) ? g.quizSeen : [];
  g.adHintUsed = g.adHintUsed || 0;
  g.adWorkBonus = g.adWorkBonus || 0;
  g.lastWorkGame = g.lastWorkGame || null;
  g.adStudyBonus = g.adStudyBonus || 0;
  g.actsSinceEnc = g.actsSinceEnc || 0;
  g.encThisSem = g.encThisSem || 0;
  g.encSeen = Array.isArray(g.encSeen) ? g.encSeen : [];
  g.q = Array.isArray(g.q) ? g.q : [];
  g.workCount = g.workCount || 0;
  g.log = g.log || '';
  g.baseMaxE = g.baseMaxE || 10;
  g.maxE = g.maxE || g.baseMaxE;
  g.e = cl(Number.isFinite(g.e) ? g.e : g.maxE, 0, g.maxE);
  g.r = cl(g.r | 0, 0, g.sems.length - 1);
  if(!Array.isArray(g.ev) || g.ev.length < 24) g.ev = buildEventOrder();
  return g;
}

function resumeRunState(){
  const saved = loadRunState();
  if(!saved){
    showGlobalNotice('找不到可讀取的存檔紀錄', true);
    updateResumeUI();
    return;
  }
  SFX.init();
  SFX.play('great');
  G = normalizeSave(saved);
  G.name = sanitizeName(G.name);
  MON = G.sems.map(x => x.code);
  $('pp').innerHTML = '';
  G.pp = createPortrait('pp', 'char_' + (G.gender || 'male'));
  G.pp.setOutfit(loadSkins().activeOutfit);
  G.pp.setAccessory(loadSkins().activeAccessory);
  $('cp').innerHTML = '';
  G.cp = createPortrait('cp', 'char_' + (G.gender || 'male'));
  G.cp.setOutfit(loadSkins().activeOutfit);G.cp.setAccessory(loadSkins().activeAccessory);
  G.t = null; // 強制刷新背景時段
  renderTurn();
  if(G.settlePhase==='settle-result')setTimeout(()=>settle(),0);
  else if(G.settlePhase==='events')setTimeout(()=>nextEv(),0);
  else if(G.settlePhase==='lottery')setTimeout(()=>endMonth(),0);
  else if(G.settlePhase==='lottery-result')setTimeout(()=>resumeInvoiceResult(),0);
  showGlobalNotice(`📂 已恢復【${G.name}】的${MON[G.r] || ''}存檔進度！`);
  if(G.bondStoryQueue.length&&G.settlePhase==='actions')setTimeout(()=>drainBondStoryQueue(),0);
  if(G.talentPending || !G.currentTalent){
    G.talentPending = true;
    renderTurn();
    setTimeout(() => openTalentModal(), 350);
  }
}

    bondStorySeen:{kai:{},yu:{},boss:{}},
    bondStoryQueue:[],
    npcOutfit:{},
    quizSeen: [],
    adHintUsed: 0,
    adWorkBonus: 0,
    adStudyBonus: 0,

    encThisSem: 0,
    encSeen: [],
    lastWorkGame: null,

    petMem: {},

function viewEndingCG(key){
  if(!END[key])return;
  const title=END[key][0],path='assets/'+ASSET_MANIFEST.endings[key];
  openModal('<div class="cg-viewer"><h2>'+title+'</h2><div class="asset-frame" style="min-height:60vh"><span class="fallback-icon">✦</span><img src="'+path+'" alt="'+title+'紀念 CG"><div hidden class="cg-fallback" style="padding:24px;color:var(--ink)"><svg viewBox="0 0 240 180" width="240" height="180" aria-hidden="true"><defs><linearGradient id="cgFallback"><stop stop-color="#172554"/><stop offset="1" stop-color="#a16207"/></linearGradient></defs><rect width="240" height="180" rx="20" fill="url(#cgFallback)"/><path d="M20 145 75 85l35 35 40-55 70 80" fill="none" stroke="#f3c262" stroke-width="5"/><text x="120" y="165" text-anchor="middle" fill="white" font-size="14">星輝學園 · '+title+'</text></svg><p>紀念圖尚未補齊，顯示星輝學園預設插畫。</p></div></div></div>',true,true);
  const image=$('modal-body').querySelector('img');image.onerror=()=>{image.hidden=true;image.nextElementSibling.hidden=false;};
}

function renderDexModal() {
  const d = dexLoad();
  const keys = Object.keys(END);
  const mode=document.querySelector('#grp-mode .f-btn.active')?.dataset.v||'full4';
  const demoHints={cat_master:'把咪寶養到 Lv.5',soulmate_yu:'小雨好感 ≥80、領先 10 點，學識 ≥30',bro_kai:'阿凱好感 ≥80 且領先其他夥伴 10 點',partner_boss:'店長好感 ≥80 且領先 10 點，存款 ≥$6,000',burnout:'讓壓力累積到 80 以上',healthy:'健康 ≥75、壓力 <35',scholar:'學識 ≥40',tycoon:'存款 ≥$5,000，且打工至少 2 次',maker:'技能 ≥25，多參加社團與專案',balanced:'各方面平均發展'};
  const hintFor=k=>mode==='demo2'?(demoHints[k]||'繼續探索以解鎖'):'完整四年制：'+(END_HINTS[k]||'繼續探索以解鎖');
  let html = '<div style="text-align:center;margin-bottom:12px;font-size:16px;color:var(--ink);">結局圖鑑</div>';
  html += '<div class="g g3" style="gap:12px;">';
  keys.forEach(k => {
    const unlocked = !!d[k];
    if (unlocked) {
      const date = new Date(d[k].t).toLocaleDateString('zh-TW');
      html += `
        <div class="card" role="button" tabindex="0" aria-label="檢視結局紀念圖" onclick="viewEndingCG('${k}')" style="background:var(--glass2);cursor:pointer">
          <h3 style="margin:6px 0;color:var(--ink);">${END[k][0]}</h3>
          <p style="font-size:14px;color:var(--mu);margin:6px 0;">${END[k][1]}</p>
          <p style="font-size:12px;color:var(--mu);margin:6px 0;">解鎖日期：${date}</p>
          <small>點擊檢視全螢幕紀念 CG</small>
        </div>
      `;
    } else {
      html += `
        <div class="card" style="background:var(--glass2);opacity:0.6;filter:grayscale(100%);position:relative;">
          <h3 style="margin:6px 0;color:var(--ink);">？？？</h3>
          <p style="font-size:13px;color:var(--mu);margin:6px 0;">提示：${hintFor(k)}</p>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
              <circle cx="12" cy="12" r="10" />
              <line x1="8" y1="8" x2="16" y2="16" />
              <line x1="16" y1="8" x2="8" y2="16" />
            </svg>
          </div>
        </div>
      `;
    }
  });
  html += '</div>';
  // 清除紀錄按鈕
  html += `<div style="margin-top:20px;text-align:center;">`;
  html += `<button id="dexClearBtn" class="pri" style="padding:8px 16px;font-size:13px;">清除紀錄</button>`;
  html += `</div>`;
  openModal(html, true, true);
  // 設定清除按鈕事件
  setTimeout(() => {
    const clearBtn = $('dexClearBtn');
    if (clearBtn) {
      clearBtn.onclick = () => {
        if (clearBtn.dataset.state === 'confirm') {
          // 第二次點擊，清除
          try { localStorage.removeItem(DEX_KEY); } catch (e) {}
          updateDexButton();
          // 重新渲染 modal
          renderDexModal();
        } else {
          // 第一次點擊，變成確認
          clearBtn.textContent = '再按一次確認';
          clearBtn.dataset.state = 'confirm';
          // 3秒後恢復
          setTimeout(() => {
            if (clearBtn && clearBtn.dataset.state === 'confirm') {
              clearBtn.textContent = '清除紀錄';
              delete clearBtn.dataset.state;
            }
          }, 3000);
        }
      };
    }
  }, 0);
}
